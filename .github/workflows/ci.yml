# Continuous integration for this edition: lint, format, tests, dependency audit and the
# public-layer leak scan, on Python 3.11. It needs no secrets. Generated by the talentai
# publish script; change it there, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements-dev.txt ruff==0.17.3 pip-audit
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tests
        run: python -m pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements-dev.txt
      - name: Leak scan (public rules)
        # Runs function-core's public leak-scan layer at the commit this edition was built
        # against. function-core is private until it goes public: until then this step
        # prints a notice and passes, and it starts scanning by itself once that
        # repository is public (nothing here needs to change). To make an unreachable
        # function-core fail the build instead, set the repository variable
        # REQUIRE_LEAK_SCAN to true.
        env:
          GIT_TERMINAL_PROMPT: "0"
          CORE_REPO: https://github.com/${{ github.repository_owner }}/function-core.git
          CORE_COMMIT: "6d7fc4dfd2dbe1356f8d13386251b273921c05bf"
          REQUIRE_LEAK_SCAN: ${{ vars.REQUIRE_LEAK_SCAN }}
        run: |
          fc="$RUNNER_TEMP/function-core"
          git init -q "$fc"
          if git -C "$fc" fetch -q --depth 1 "$CORE_REPO" "$CORE_COMMIT" 2>/dev/null; then
            git -C "$fc" checkout -q FETCH_HEAD
            python "$fc/build/leak_scan.py" . --public-only
          elif [ "$REQUIRE_LEAK_SCAN" = "true" ]; then
            echo "::error::function-core could not be fetched at $CORE_COMMIT"
            exit 1
          else
            echo "::notice::function-core is not public yet; leak scan skipped"
          fi
