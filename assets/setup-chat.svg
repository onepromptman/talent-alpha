<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-label="A sourcing plan built around your roles"><rect width="960" height="510" rx="14" fill="#ffffff" stroke="#d1d9e0"/><text x="30" y="44" font-size="20" fill="#1f2328" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">A sourcing plan built around your roles</text><rect x="745.6" y="70" width="184.4" height="38" rx="12" fill="#bf5b04"/><text x="763.6" y="94" font-size="14" fill="#ffffff" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">set up talent alpha</text><rect x="30" y="120" width="541.5999999999999" height="38" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="48" y="144" font-size="14" fill="#1f2328" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Fresh job-impact news + role fit + location = a lead to investigate.</text><rect x="449.20000000000005" y="170" width="480.79999999999995" height="38" rx="12" fill="#bf5b04"/><text x="467.20000000000005" y="194" font-size="14" fill="#ffffff" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Example Co. We need Senior Controls Engineers in Denver.</text><rect x="30" y="220" width="572.0" height="38" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="48" y="244" font-size="14" fill="#1f2328" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Which skills and work terms matter? Where can you hire?</text><rect x="365.6" y="270" width="564.4" height="38" rx="12" fill="#bf5b04"/><text x="383.6" y="294" font-size="14" fill="#ffffff" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">PLC and robotics. On-site in Denver; relocation available.</text><rect x="30" y="320" width="526.4" height="38" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="48" y="344" font-size="14" fill="#1f2328" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">I suggest plant cuts in robotics and automation. Useful fit?</text><rect x="441.6" y="370" width="488.4" height="38" rx="12" fill="#bf5b04"/><text x="459.6" y="394" font-size="14" fill="#ffffff" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Yes. Add aerospace, and prioritize site closures.</text><rect x="30" y="420" width="442.79999999999995" height="38" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="48" y="444" font-size="14" fill="#1f2328" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Plan saved. Run this role daily, or add another target.</text><text x="30" y="492" font-size="13" fill="#59636e" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">An illustration of the conversation, not a screenshot. Your answers will differ.</text></svg>
