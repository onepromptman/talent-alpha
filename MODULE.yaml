module: talent-alpha
description: A nightly or on-demand scan of layoff/WARN notices and funding-distress news that scores each signal against your open role and emails or renders one ranked card: who just became reachable, why now, your outreach hook and your edge. A fast scanner shortlists, then two independent judges (Advocate and Skeptic) argue each candidate, so no single model grades its own work. Ships as a standalone n8n workflow and as this Cowork/Claude Code plugin. Installs from onepromptman/talent-alpha.
version: 1.5.0
stages: [pull, dedupe, shortlist, judge, reconcile, render]

tiers:
  Filed: a government WARN Act filing (source_name "WARN Firehose"); highest confidence, dated, official, employer-attributed
  Reported: dated news or search coverage of layoffs or funding distress (source_name "Web Search" or "Perplexity Search"); single-source until corroborated
  Company-stated: a fact from the user's own saved profile, inside COMPANY_PROFILE; never independently verified

agents:
  scanner: {role: executor}
  advocate: {role: executor, verifier: critic}
  skeptic: {role: executor, verifier: critic}
  critic: {role: verifier, template: critic}

evals:
  commands:
    - python -m pytest -q
  cases: evals
  post_run:
    card-accuracy: python skills/talent-alpha/scripts/validate_card.py check --card {workspace}/out/card.content.json --pull {workspace}/fixtures --max-shown 10
